spring:
  application:
    name: snail-backend
  datasource:
    url: jdbc:mysql://localhost:3306/snail?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: snail
    password: snail_dev_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  redis:
    host: localhost
    port: 6379
    password:
    database: 0

server:
  port: 8080

jwt:
  secret: snail-jwt-secret-key-for-development-only-please-change-in-production
  expiration: 86400000
