version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: snail-mysql
    environment:
      MYSQL_ROOT_PASSWORD: snail_dev_password
      MYSQL_DATABASE: snail
      MYSQL_USER: snail
      MYSQL_PASSWORD: snail_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - snail-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: snail-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - snail-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:

networks:
  snail-network:
    driver: bridge
